name: CI Pipeline - Calidad y DevSecOps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-sonar:
    name: Build, Tests y Análisis SAST
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio completo (requerimiento para SonarCloud)
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configuración del entorno de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Instalación de dependencias mitigando riesgos de ejecución de scripts
      - name: Instalar dependencias
        run: npm install --ignore-scripts --no-audit

      # 4. Ejecución de pruebas unitarias y generación de cobertura
      - name: Ejecutar pruebas y cobertura
        run: npm test

      # 5. Análisis estático SAST con SonarCloud (versión estable fijada)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.sources=src
            -Dsonar.tests=tests
